# Plantilla de Fly.io para PRODUCCIÓN (ADR 0015, docs/produccion.md). NO está validada con `fly`: todavía no existe la cuenta.
# Antes de usarla: cambiar `app` por el nombre real (único en toda Fly) y revisar con `fly config validate`.
# Las variables públicas (NEXT_PUBLIC_*) se pasan al construir con `fly deploy --build-arg ...`; los secretos, con `fly secrets set`.
app = "ucomenu-prod"
primary_region = "gru" # São Paulo: junto al proyecto de Supabase (crearlo en la región de São Paulo)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # Siempre encendida: la sala consulta cada 3 s y los comensales no pueden esperar un arranque en frío.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 512 MB alcanzan para el piloto (medido: ~80 MB en reposo, ~420 MB como pico con 11 navegadores en paralelo).
  # Subir a 1gb si la memoria pasa del 80 % de forma sostenida o hay reinicios por falta de memoria (docs/operacion.md).
  memory = "512mb"
